[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-audit"
version = "0.2.0"
description = "Crawl a site and return the technical SEO issues that matter, ranked by severity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ángel Muñiz Pedraza", email = "angelhd029@gmail.com" }]
keywords = ["seo", "crawler", "technical-seo", "indexation", "json-ld", "site-audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.31.0", "beautifulsoup4>=4.12.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/angelmunizpedraza/seo-audit"
Issues = "https://github.com/angelmunizpedraza/seo-audit/issues"

[project.scripts]
seo-audit = "seo_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["seo_audit*"]
