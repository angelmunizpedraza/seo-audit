name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -q

  action:
    name: The action must run against a real site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this repository's own action
        uses: ./
        with:
          url: https://example.com
          max-pages: "3"
          max-depth: "1"
          fail-on-critical: "false"
          json: example-com.json
      - name: The report must exist
        run: test -s example-com.json
